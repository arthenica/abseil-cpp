name: Tests

on:
  # continuous runs
  schedule:
    # Run every hour
    - cron: "0 * * * *"

  # postsubmit runs
  push:
    branches:
      - master
      - lts_*

  # presubmit runs
  pull_request:
    branches:
      - master
      - lts_*

  # manual runs
  workflow_dispatch:

permissions:
  contents: read

# Avoid running twice at the same time over the same changes.
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ contains(fromJSON('["pull_request", "workflow_dispatch", "schedule"]'), github.event_name) }}

jobs:
  # Mirrors the 10 Linux "latest" Bazel Kokoro jobs (parallelized to 1 job per
  # Bazel invocation). Not yet covered here:
  #   - "Linux GCC/libstdc++ (floor) Bazel" (requires a floor GCC Docker image)
  #   - CMake, macOS, and Windows Kokoro jobs
  linux:
    runs-on: ubuntu-24.04${{ matrix.config.arch-suffix }}
    name: Linux ${{ matrix.config.name }} (${{ matrix.std }}, ${{ matrix.compilation_mode }}) Bazel
    container:
      image: gcr.io/google.com/absl-177019/gloop-linux-toolchain-latest@sha256:a820c79d3f356a64db121a4ee16c4408df18f9d2c8bf6c6abfae21666ac003ba
      options: --cap-add=SYS_PTRACE
      credentials:
        # TODO(b/573304451): Switch to Workload Identity Federation to avoid the need for secrets.
        username: _json_key
        password: ${{ secrets.GAR_SERVICE_ACCOUNT }}
    strategy:
      fail-fast: false  # Don't cancel all jobs if one fails.
      matrix:
        std: ["c++17", "c++20", "c++23"]
        compilation_mode: ["opt", "fastbuild"]
        config:
          # linux_clang-latest_libcxx_bazel.cfg
          - name: Clang/libc++
            toolchain: clang
          # linux_clang-latest_libcxx_exceptions_bazel.cfg (fastbuild only)
          - name: Clang/libc++ -fexceptions
            toolchain: clang
            exceptions: -fexceptions
          # linux_clang-latest_libcxx_alternate_options_bazel.cfg
          - name: Clang/libc++ alternate options
            toolchain: clang
            alternate_options: true
          # linux_clang-latest_libcxx_asan_bazel.cfg (fastbuild only)
          - name: Clang/libc++ ASAN
            toolchain: asan
          # linux_clang-latest_libcxx_tsan_bazel.cfg (fastbuild only)
          - name: Clang/libc++ TSAN
            toolchain: tsan
          # linux_clang-latest_libstdcxx_bazel.cfg
          - name: Clang/libstdc++
            toolchain: libstdc++
          # linux_gcc-latest_libstdcxx_bazel.cfg
          - name: GCC/libstdc++
            toolchain: gcc
          # linux_gcc-latest_libstdcxx_exceptions_bazel.cfg (fastbuild only)
          - name: GCC/libstdc++ -fexceptions
            toolchain: gcc
            exceptions: -fexceptions
          # linux_gcc-latest_libstdcxx_alternate_options_bazel.cfg
          - name: GCC/libstdc++ alternate options
            toolchain: gcc
            alternate_options: true
          # linux_arm_clang-latest_libcxx_bazel.cfg (c++17 and c++20 only)
          - name: ARM64 Clang/libc++
            toolchain: clang-arm
            arch-suffix: -arm
        exclude:
          - compilation_mode: opt
            config:
              name: Clang/libc++ -fexceptions
              toolchain: clang
              exceptions: -fexceptions
          - compilation_mode: opt
            config:
              name: Clang/libc++ ASAN
              toolchain: asan
          - compilation_mode: opt
            config:
              name: Clang/libc++ TSAN
              toolchain: tsan
          - compilation_mode: opt
            config:
              name: GCC/libstdc++ -fexceptions
              toolchain: gcc
              exceptions: -fexceptions
          - std: c++23
            config:
              name: ARM64 Clang/libc++
              toolchain: clang-arm
              arch-suffix: -arm
    env:
      USE_BAZEL_VERSION: 9.x
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Set up alternate options
        if: ${{ matrix.config.alternate_options }}
        run: cp ci/absl_alternate_options.h absl/base/options.h

      - name: Setup continuous run
        if: ${{ github.event_name == 'schedule' }}
        # Force builds and tests to run on scheduled runs.
        run: echo "EXTRA_BAZEL_ARGS=--cache_test_results=no --action_env=FORCE_REBUILD=1" >> $GITHUB_ENV

      - name: Set up Bazel and caches
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: true
          bazelisk-cache: true
          external-cache: true
          repository-cache: false
          google-credentials: ${{ secrets.GAR_SERVICE_ACCOUNT }}
          bazelrc: common --config=remote${{ matrix.config.arch-suffix }}

      - name: Fetch all external dependencies
        run: bazel fetch //...

      - name: Run tests
        run: >
          bazel test ...
          --config=${{ matrix.config.toolchain }}
          --cxxopt=-std=${{ matrix.std }}
          --host_cxxopt=-std=${{ matrix.std }}
          --compilation_mode=${{ matrix.compilation_mode }}
          --copt=${{ matrix.config.exceptions || '-fno-exceptions' }}
          ${{ env.EXTRA_BAZEL_ARGS }}

  # Provide a single predictably-named job for copybara to look for
  all-blocking-tests:
    name: All Blocking Tests
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check for cancellations
        if: ${{ contains(join(needs.*.result, ' '), 'cancelled') }}
        run: echo "One or more tests were cancelled.  If this was a presubmit job cancelled by a submit job, you can ignore this." && exit 1
      - name: Check for failures
        if: ${{ contains(join(needs.*.result, ' '), 'failure') }}
        run: echo "One or more tests failed.  Please check the logs above and fix the issues." && exit 1
    # This workflow must run even if one or more of the dependent workflows
    # failed.
    if: always()
